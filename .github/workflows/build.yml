name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the web build does not need the Electron binary; skipping it keeps CI fast
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Catalogue tests
        run: node --test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest and a browser
        run: |
          pip install pytest playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Smoke test of the built site
        env:
          SITE_DIR: dist
        run: python -m pytest -q tests
